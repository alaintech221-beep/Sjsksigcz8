[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  # Le timeout par défaut des fonctions Netlify (Lambda) est de 10s sur le
  # plan gratuit. FETCH_TIMEOUT_MS dans generate.js est fixé à 12s : sur le
  # plan gratuit, augmente cette valeur jusqu'à 26s n'est possible que sur
  # un plan payant (Pro et supérieur). Si tu restes sur le plan gratuit,
  # baisse FETCH_TIMEOUT_MS à 9000 pour rester sous la limite Netlify et
  # renvoyer TON message d'erreur plutôt qu'un 502 générique de Netlify.
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # CSP : autorise les polices Google, le script Cloudflare Turnstile,
    # et les appels vers ta propre fonction Netlify (same-origin, donc
    # pas besoin de connect-src externe pour /.netlify/functions/generate).
    # Note : script-src inclut 'unsafe-inline' car index.html utilise un
    # <script> inline (pas de fichier .js séparé). C'est moins strict qu'une
    # CSP avec nonce, mais reste utile contre l'injection de scripts tiers
    # (widgets, extensions malveillantes, etc.). Pour une CSP plus stricte,
    # il faudrait externaliser le script et générer un nonce par requête
    # (impossible avec un simple fichier statique servi par le CDN Netlify).
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
